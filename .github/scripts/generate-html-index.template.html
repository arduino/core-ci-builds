<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Core CI Registry</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f8f9fa; padding: 20px; color: #212529; margin: 0; }
        .container { max-width: 1300px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .search-container { margin-bottom: 20px; }
        #searchInput { width: 100%; padding: 12px 15px; font-size: 16px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out; }
        #searchInput:focus { border-color: #86b7fe; outline: 0; box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25); }
        .grid-row { display: grid; grid-template-columns: 32px 4fr 5fr 2fr; gap: 15px; padding: 10px 15px; align-items: center; }
        .table-header { font-weight: 700; background: #e9ecef; border-bottom: 2px solid #dee2e6; border-radius: 4px; }
        .sortable { cursor: pointer; user-select: none; padding: 5px; border-radius: 4px; transition: background 0.1s; }
        .sortable:hover { background: #dee2e6; }
        summary { cursor: pointer; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        .summary-row, .sub-summary-row { position: relative; padding-left: 34px; }
        .summary-row::before, .sub-summary-row::before {
            content: '▸'; position: absolute; left: 14px; top: 50%;
            color: #adb5bd; transform: translateY(-50%); transition: transform 0.15s ease;
        }
        details[open] > .summary-row::before, details[open] > .sub-summary-row::before {
            transform: translateY(-50%) rotate(90deg);
        }
        .row-actions { display: inline-flex; gap: 4px; margin-left: 10px; vertical-align: middle; }
        .icon-btn { background: none; border: none; cursor: pointer; font: inherit; font-size: 0.85em;
                    padding: 2px 5px; border-radius: 4px; line-height: 1; opacity: 0.6; text-decoration: none; }
        .icon-btn:hover { opacity: 1; background: #dee2e6; }
        .copy-btn.copied { opacity: 1; }
        .verify-result { display: inline-flex; flex-wrap: wrap; gap: 3px; margin-left: 4px; vertical-align: middle; }
        .verify-badge { font-size: 0.78em; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
        .verify-ok   { color: #0f5132; background: #d1e7dd; }
        .verify-warn { color: #664d03; background: #fff3cd; }
        .verify-bad  { color: #842029; background: #f8d7da; }
        .verify-progress { color: #495057; background: #e9ecef; }
        .file-item { border-bottom: none; box-shadow: 0 1px 0 0 #e9ecef; }
        .summary-row { font-weight: 600; }
        .summary-row:hover { background: #f8f9fa; }
        .sub-group { margin-left: 20px; border-left: 3px solid #adb5bd; margin-bottom: 5px; }
        .sub-group::after { content: ''; display: block; border-top: 1px solid #e9ecef; }
        .sub-summary-row { background: #fdfdfd; font-size: 0.95em; font-weight: 500; border-bottom: 1px solid #f1f3f5; }
        .sub-summary-row:hover { background: #f1f3f5; }
        .detail-row { background: #ffffff; margin-left: 20px; font-size: 0.85em; border-bottom: 1px dashed #f1f3f5; }
        /* Row left borders to match badges */
        .sub-group:has(.badge-platform) { border-left-color: #badbcc; }
        .sub-group:has(.badge-tool)     { border-left-color: #88b4fc; }
	.detail-row:last-child { border-bottom: none; }
        .tree-branch { color: #adb5bd; margin-right: 8px; font-weight: 400; }
        a { color: #0d6efd; text-decoration: none; }
        a:hover { text-decoration: underline; }
	.badge { display: inline-block; padding: 0.35em 0.65em; font-size: 0.85em; font-weight: 600; line-height: 1; text-align: center; white-space: nowrap; vertical-align: baseline; border-radius: 50rem; margin-right: 5px; }
	.badge-branch { color: #664d03; background-color: #fff3cd; border: 1px solid #ffecb5; }
	.badge-platform { color: #0f5132; background-color: #d1e7dd; /* Light green */ border: 1px solid #badbcc; }
	.badge-tool { color: #2862c8; background-color: #dfefff; /* Light blue */ border: 1px solid #b6d4fe; }
	.badge-official  { color: #41464b; background-color: #e2e3e5; border: 1px solid #d3d6d8; }
	.badge-tag       { color: #1a7f37; background-color: #dafbe1; border: 1px solid #aceebb; }
	.badge-more      { color: #6c757d; background-color: #f8f9fa; border: 1px solid #dee2e6; font-size: 0.8em; }
        .official-item { display: none; }
        .official-item, .official-item > .sub-group > .grid-row { color: #808080; }
        #emptyMessage { display: none; padding: 20px; text-align: center; color: #adb5bd; font-style: italic; }
        footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid #dee2e6; text-align: right; font-size: 0.8em; color: #adb5bd; }
        .commit-summary { display: block; font-size: 0.82em; color: #6c757d; font-style: italic; margin-top: 2px; }
        .commit-stats-inline { display: block; font-size: 0.78em; color: #6c757d; margin-top: 1px; }
        .stat-add { color: #3fb950; }
        .stat-del { color: #f85149; }
        .stat-files { color: #d29922; }
        .activity-cell { text-align: center; font-size: 1.1em; }
        .page-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .page-header img { width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0; }
        .page-header-content { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .page-header h2 { margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <img src="https://avatars.githubusercontent.com/u/4233897?v=4" alt="Arduino CI">
            <div class="page-header-content">
                <h2>Core CI Registry</h2>
                <input type="text" id="searchInput" placeholder="Filter by packager, tool, version (e.g. 'openocd 0.11')...">
            </div>
        </div>
        <div class="grid-row table-header" id="tableHeader">
            <span></span>
            <span class="sortable" data-col="1">Name ↕</span>
            <span class="sortable" data-col="2">Latest Version ↕</span>
            <span class="sortable" data-col="3">Last Modified ↕</span>
        </div>

        <div id="emptyMessage">No matching results.</div>
        <div id="fileList">
            {{ FILE_LIST_CONTENT }}
        </div>

        <footer>Last updated: <span class="ts" data-ts="{{ GENERATED_AT }}">{{ GENERATED_AT }}</span></footer>
    </div>
    <script>
        // Copy a first-level row's index URL to the clipboard
        function copyIndexUrl(evt, btn) {
            evt.preventDefault();
            evt.stopPropagation();
            const url = btn.dataset.url;
            navigator.clipboard.writeText(url).then(() => {
                const original = btn.textContent;
                btn.textContent = '✅';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1200);
            });
        }

        // Pull {host, url, size, checksum} entries out of a fetched snippet JSON
        function extractArtifacts(snippet, kind) {
            const pkg = snippet.packages[0];
            return kind === 'platform'
                ? [{ host: null, url: pkg.platforms[0].url, size: pkg.platforms[0].size, checksum: pkg.platforms[0].checksum }]
                : pkg.tools[0].systems.map(s => ({ host: s.host, url: s.url, size: s.size, checksum: s.checksum }));
        }

        // Fetch a snippet's JSON, extract its remote artifact URL(s), then HEAD-check each.
        // Also caches the artifact list on the wrapper and reveals the full-download button.
        async function testRemoteUrls(evt, btn) {
            evt.preventDefault();
            evt.stopPropagation();
            const wrapper = btn.closest('.snippet-check');
            if (btn.dataset.busy) return;
            btn.dataset.busy = '1';
            const resultEl = wrapper.querySelector('.verify-result');
            const fullBtn = wrapper.querySelector('.full-verify-btn');
            const original = btn.textContent;
            btn.textContent = '⏳';

            let urls;
            try {
                const snippet = await fetch(wrapper.dataset.snippet, { cache: 'no-store' }).then(r => r.json());
                urls = extractArtifacts(snippet, wrapper.dataset.kind);
                wrapper.dataset.artifacts = JSON.stringify(urls);
                fullBtn.style.display = '';
            } catch {
                btn.textContent = original;
                delete btn.dataset.busy;
                resultEl.innerHTML = '<span class="verify-badge verify-bad">snippet fetch failed</span>';
                return;
            }

            const checks = await Promise.all(urls.map(async ({ host, url, size }) => {
                try {
                    const resp = await fetch(url, { method: 'HEAD', cache: 'no-store' });
                    const len = resp.headers.get('content-length');
                    if (!resp.ok) return { host, state: 'bad', label: `HTTP ${resp.status}` };
                    if (len == null) return { host, state: 'warn', label: 'no size' };
                    if (len === String(size)) return { host, state: 'ok', label: fmtBytes(len) };
                    const delta = Number(len) - Number(size);
                    return {
                        host, state: 'warn', label: `${fmtBytes(len)} (Δ${delta > 0 ? '+' : ''}${delta}B)`,
                        detail: `expected ${size} bytes, got ${len} bytes (Δ${delta > 0 ? '+' : ''}${delta}B)`,
                    };
                } catch {
                    return { host, state: 'bad', label: 'unreachable' };
                }
            }));

            btn.textContent = original;
            delete btn.dataset.busy;
            resultEl.innerHTML = checks.map(c =>
                `<span class="verify-badge verify-${c.state}" title="${c.detail || c.host || 'file'}">${c.host ? c.host + ': ' : ''}${c.label}</span>`
            ).join('');
        }

        // Full download + SHA-256 verify, with a live bytes/elapsed-seconds counter per
        // artifact so a stalled transfer is visible (frozen byte count, ticking timer)
        // instead of an unbounded silent wait. Buffers the whole artifact in memory
        // since crypto.subtle.digest() has no incremental/streaming form.
        async function verifyChecksum(evt, btn) {
            evt.preventDefault();
            evt.stopPropagation();
            if (btn.dataset.busy) return;
            const wrapper = btn.closest('.snippet-check');
            const artifacts = JSON.parse(wrapper.dataset.artifacts || '[]');
            if (!artifacts.length) return;
            btn.dataset.busy = '1';
            const resultEl = wrapper.querySelector('.full-verify-result');

            resultEl.innerHTML = artifacts.map(({ host }) =>
                `<span class="verify-badge verify-progress">${host ? host + ': ' : ''}0B (0s)</span>`
            ).join('');
            const badges = resultEl.children;

            await Promise.all(artifacts.map(async ({ host, url, size, checksum }, i) => {
                const badge = badges[i];
                const startedAt = Date.now();
                let received = 0;
                const tick = setInterval(() => {
                    const elapsed = Math.round((Date.now() - startedAt) / 1000);
                    badge.textContent = `${host ? host + ': ' : ''}${fmtBytes(received)}/${fmtBytes(size)} (${elapsed}s)`;
                }, 1000);

                try {
                    const resp = await fetch(url, { cache: 'no-store' });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const chunks = [];
                    const reader = resp.body.getReader();
                    for (;;) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        received += value.byteLength;
                    }
                    const buf = new Uint8Array(received);
                    let offset = 0;
                    for (const chunk of chunks) {
                        buf.set(chunk, offset);
                        offset += chunk.byteLength;
                    }
                    const digest = await crypto.subtle.digest('SHA-256', buf.buffer);
                    const hex = [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
                    const expected = (checksum || '').split(':').pop().toLowerCase();
                    clearInterval(tick);
                    const matches = hex === expected;
                    badge.className = matches ? 'verify-badge verify-ok' : 'verify-badge verify-bad';
                    badge.textContent = `${host ? host + ': ' : ''}${matches ? 'checksum OK' : 'checksum mismatch'}`;
                    if (!matches) badge.title = `expected SHA-256:${expected}\ngot SHA-256:${hex}`;
                } catch (e) {
                    clearInterval(tick);
                    badge.className = 'verify-badge verify-bad';
                    badge.textContent = `${host ? host + ': ' : ''}${e.message || 'download failed'}`;
                }
            }));

            delete btn.dataset.busy;
        }

        function fmtBytes(n) {
            n = Number(n);
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'MB';
            if (n >= 1e3) return (n / 1e3).toFixed(0) + 'KB';
            return n + 'B';
        }

        // Age formatting
        function fmtAge(ts) {
            if (!ts) return '';
            const dt = new Date(ts);
            if (isNaN(dt)) return ts;
            const deltaMs = Date.now() - dt.getTime();
            const deltaDays = Math.floor(deltaMs / 86400000);
            let age;
            if (deltaDays === 0) {
                const hours = Math.floor(deltaMs / 3600000);
                age = hours < 1 ? 'just now \u2728' : `${hours} hour${hours > 1 ? 's' : ''} ago`;
            } else if (deltaDays < 7) {
                age = `${deltaDays} day${deltaDays > 1 ? 's' : ''} ago`;
            } else if (deltaDays < 30) {
                const weeks = Math.floor(deltaDays / 7);
                age = `${weeks} week${weeks > 1 ? 's' : ''} ago`;
            } else if (deltaDays < 365) {
                const months = Math.floor(deltaDays / 30);
                age = `${months} month${months > 1 ? 's' : ''} ago`;
            } else {
                const years = Math.floor(deltaDays / 365);
                age = `over ${years === 1 ? 'a' : years} year${years > 1 ? 's' : ''} ago`;
            }
            const pad = n => String(n).padStart(2, '0');
            const display = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
            return `${display}<br>(${age})`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('span.ts[data-ts]').forEach(el => {
                el.innerHTML = fmtAge(el.dataset.ts);
            });

            // Activity icon in the leftmost cell of branch summary rows
            function activityIcon(ts) {
                if (!ts) return '';
                const age = Date.now() - new Date(ts).getTime();
                const h = 3600000, d = 86400000;
                if (age < 24 * h)      return '<span title="New (< 24h)">✨</span> ';
                if (age < 15 * d)      return '<span title="Active (< 15 days)">🟢</span> ';
                if (age < 180 * d)     return '<span title="Sleeping (< 6 months)">💤</span> ';
                return '<span title="Frozen (> 6 months)">🧊</span> ';
            }

            document.querySelectorAll('.file-item:not(.official-item) > summary.summary-row').forEach(row => {
                const tsEl = row.children[3]?.querySelector('[data-ts]');
                const ts = tsEl?.dataset.ts;
                const iconCell = row.children[0];
                if (iconCell && ts) {
                    iconCell.innerHTML = activityIcon(ts);
                }
            });

            // Auto-expand the sub-group when its parent entry opens, if it's the only one (platform or tool)
            document.querySelectorAll('.file-item').forEach(item => {
                item.addEventListener('toggle', () => {
                    if (!item.open) return;
                    const groups = item.querySelectorAll(':scope > .sub-group');
                    if (groups.length === 1) {
                        groups[0].open = true;
                    }
                });
            });
        });

        // Filtering Logic
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchWords = e.target.value.toLowerCase().split(/\s+/).filter(word => word.length > 0);
            const fileItems = document.querySelectorAll('.file-item');

            fileItems.forEach(item => {
                if (searchWords.length === 0) {
                    item.style.display = item.classList.contains('official-item') ? 'none' : 'block';
                    item.open = false;
                    item.querySelectorAll('.sub-group').forEach(sub => { sub.open = false; sub.style.display = ''; });
                    item.querySelectorAll('.detail-row').forEach(row => row.style.display = '');
                    return;
                }

                // Filter detail rows, then cascade up
                item.querySelectorAll('.detail-row').forEach(row => {
                    const rowText = row.textContent.toLowerCase();
                    row.style.display = searchWords.every(w => rowText.includes(w)) ? '' : 'none';
                });

                let itemHasVisible = false;
                item.querySelectorAll('.sub-group').forEach(sub => {
                    const headerText = sub.querySelector('.sub-summary-row').textContent.toLowerCase();
                    const headerMatches = searchWords.every(w => headerText.includes(w));
                    const anyVisible = Array.from(sub.querySelectorAll('.detail-row'))
                                            .some(r => r.style.display !== 'none');
                    const show = anyVisible || headerMatches;
                    sub.style.display = show ? '' : 'none';
                    if (show) { itemHasVisible = true; }
                    // only expand if necessary (only detail rows matched)
                    sub.open = anyVisible && !headerMatches;
                });

                item.style.display = itemHasVisible ? 'block' : 'none';
                if (itemHasVisible) item.open = true;
            });
            const anyVisible = Array.from(fileItems).some(i => i.style.display !== 'none');
            document.getElementById('emptyMessage').style.display = (searchWords.length > 0 && !anyVisible) ? 'block' : 'none';
        });

        // Sorting Logic
        let currentSortCol = -1;
        let sortAsc = true;

        document.querySelectorAll('.sortable').forEach(header => {
            header.addEventListener('click', () => {
                const colIndex = parseInt(header.getAttribute('data-col'));
                const fileList = document.getElementById('fileList');
                const items = Array.from(fileList.querySelectorAll(':scope > .file-item'));

                if (currentSortCol === colIndex) {
                    sortAsc = !sortAsc;
                } else {
                    currentSortCol = colIndex;
                    sortAsc = true;
                }

                document.querySelectorAll('.sortable').forEach(el => {
                    let text = el.textContent.replace(' ▲', '').replace(' ▼', '').replace(' ↕', '');
                    if (parseInt(el.getAttribute('data-col')) === colIndex) {
                        el.textContent = text + (sortAsc ? ' ▲' : ' ▼');
                    } else {
                        el.textContent = text + ' ↕';
                    }
                });

                items.sort((a, b) => {
                    const aSpan = a.querySelector('.summary-row').children[colIndex];
                    const bSpan = b.querySelector('.summary-row').children[colIndex];
                    const aText = aSpan.textContent.trim().toLowerCase();
                    const bText = bSpan.textContent.trim().toLowerCase();

                    if (aText < bText) return sortAsc ? -1 : 1;
                    if (aText > bText) return sortAsc ? 1 : -1;
                    return 0;
                });

                items.forEach(item => fileList.appendChild(item));
            });
        });

    </script>
</body>
</html>
